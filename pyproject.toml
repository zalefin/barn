[project]
name = "agent-platform"
version = "0.1.0"
description = "Personal EC2 dev boxes for long-running agent runs"
readme = "README.md"
authors = [
    { name = "Zach Lefin", email = "zachlefin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.118",
]

[project.scripts]
agent-platform = "agent_platform.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
