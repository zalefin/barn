[project]
name = "barn"
version = "0.2.0"
description = "Personal EC2 dev boxes for long-running agent runs"
readme = "README.md"
authors = [
    { name = "Zach Lefin", email = "zachlefin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.118",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
barn = "barn.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
# Terraform data dirs left by running terraform by hand inside a packaged root.
source-exclude = [".terraform", ".state", "*.tfstate*"]
