# barn settings. Written by `barn init`; edit freely. Run `barn init` again for a checklist.
config_version = "$version"       # barn's format of this file; a newer barn migrates it (keeps a .bak)
default_account = "$account"      # accounts/<account>.toml, used when a command has no --account
user = "$user"                    # barn:owner on boxes you create (box names are your choice, e.g. $user-dev)
ssh_public_key = "$ssh_public_key"
default_size = "m7i.xlarge"       # 4 vCPU, 16 GiB
passwordless_sudo = true
idle_hours = 4
volume_gb = 100
# shared_home = "~/src/team-dotfiles/home"   # optional team defaults, synced before home/

# Tables last: every key below a [table] line belongs to that table.

# One AWS CLI profile per account (accounts/<account>.toml), assuming
# barn-manager or barn-guest there. Add a line for each account you use.
[aws_profiles]
$account = "$aws_profile"

# Per account, public keys that may also SSH into boxes you create there (pushed
# by create and sync; remove one and run `barn sync <name>` to revoke it):
[guest_keys]
# $account = [
#   "ssh-ed25519 AAAA... alice",
# ]
